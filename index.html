<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random File Downloader</title>
</head>
<body>

    <button id="downloadBtn">Download Random File</button>

    <script>
        // List the exact names of the files you plan to upload below
        const files = [
            'file1.pdf',
            'file2.zip',
            'image3.png'
        ];

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const randomIndex = Math.floor(Math.random() * files.length);
            const randomFile = files[randomIndex];

            const link = document.createElement('a');
            link.href = randomFile; // Points directly to the file in your repository
            link.download = randomFile; 
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>

</body>
</html>
